<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Macro Tracker</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b6abf">

<!-- iOS PWA support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macros">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script async src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f4f0;--card:#fff;--accent:#5b6abf;--accent-light:#eef0ff;
  --green:#2d8e5e;--green-light:#e4f5ec;--orange:#d97a2a;--orange-light:#fdf1e4;
  --red:#c94444;--red-light:#fce8e8;--blue:#3f7fcf;--blue-light:#e6f0fc;
  --text:#1e1e1e;--text2:#555;--text3:#999;--border:#e5e3de;
  --shadow:0 2px 16px rgba(0,0,0,0.06);--radius:14px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,#5b6abf,#7b6bc7);color:#fff;padding:26px 20px 22px;padding-top:calc(26px + env(safe-area-inset-top));text-align:center}
header h1{font-size:1.5rem;font-weight:800;letter-spacing:-0.5px}
header p{font-size:.8rem;opacity:.8;margin-top:2px}
.container{max-width:660px;margin:0 auto;padding:0 14px 60px}

/* Tabs */
.tabs{display:flex;gap:3px;margin:18px 0 14px;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.tab{flex:1;padding:10px 6px;text-align:center;border-radius:10px;font-size:.78rem;font-weight:600;cursor:pointer;border:none;background:0;color:var(--text3);transition:.2s}
.tab.active{background:var(--accent);color:#fff}
.tab:hover:not(.active){background:var(--accent-light);color:var(--accent)}

/* Summary cards */
.summary{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.summary h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-bottom:14px}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.macro-card{text-align:center;padding:10px 4px;border-radius:10px}
.macro-card.cal-card{background:#f0f1ff}.macro-card.pro-card{background:var(--green-light)}
.macro-card.carb-card{background:var(--orange-light)}.macro-card.fat-card{background:var(--blue-light)}
.macro-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.cal-label{color:var(--accent)}.pro-label{color:var(--green)}.carb-label{color:var(--orange)}.fat-label{color:var(--blue)}
.macro-val{font-size:1.35rem;font-weight:800;margin:2px 0}
.cal-val{color:var(--accent)}.pro-val{color:var(--green)}.carb-val{color:var(--orange)}.fat-val{color:var(--blue)}
.macro-target{font-size:.68rem;color:var(--text3)}
.pbar-wrap{height:5px;background:rgba(0,0,0,.08);border-radius:3px;margin-top:6px;overflow:hidden}
.pbar{height:100%;border-radius:3px;transition:width .4s}
.cal-bg{background:var(--accent)}.pro-bg{background:var(--green)}.carb-bg{background:var(--orange)}.fat-bg{background:var(--blue)}

/* Remaining banner */
.remaining-banner{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);border-left:4px solid var(--green)}
.remaining-banner h4{font-size:.82rem;font-weight:700;margin-bottom:8px;color:var(--green)}
.remaining-row{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem}
.remaining-item{display:flex;align-items:center;gap:5px}
.remaining-dot{width:8px;height:8px;border-radius:50%}
.remaining-val{font-weight:700}
.remaining-unit{color:var(--text3)}
.suggestions{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.suggestions h5{font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-bottom:8px}
.sug-chips{display:flex;flex-wrap:wrap;gap:6px}
.sug-chip{font-size:.75rem;background:var(--green-light);color:var(--green);padding:5px 12px;border-radius:20px;cursor:pointer;border:none;font-family:inherit;font-weight:500;transition:.2s}
.sug-chip:hover{background:var(--green);color:#fff}

/* Meal section */
.meal-sec{background:var(--card);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow)}
.meal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none}
.meal-hdr:hover{background:#fafaf8}
.meal-left{display:flex;align-items:center;gap:10px}
.meal-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem}
.meal-nm{font-weight:700;font-size:.88rem}
.meal-sub{font-size:.72rem;color:var(--text3)}
.meal-caret{font-size:.7rem;color:var(--text3);transition:transform .2s}
.meal-caret.open{transform:rotate(180deg)}
.meal-body{padding:0 18px 16px}

/* Food items */
.food-item{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.food-item:last-child{border-bottom:0}
.fi-name{flex:1;font-weight:500}
.fi-qty{font-size:.72rem;color:var(--text3);margin-left:4px;font-weight:400}
.fi-macros{display:flex;gap:10px;font-size:.72rem}
.fi-macros span{min-width:38px;text-align:right}
.fi-del{background:0;border:0;color:var(--red);cursor:pointer;font-size:1rem;margin-left:8px;padding:2px 5px;border-radius:4px}
.fi-del:hover{background:var(--red-light)}

/* Search input */
.search-wrap{position:relative;margin-bottom:8px}
.search-input{width:100%;padding:10px 14px;padding-right:40px;border:2px solid var(--border);border-radius:10px;font-size:.85rem;font-family:inherit;outline:0;transition:border .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:0;border:0;font-size:1rem;color:var(--text3);cursor:pointer;display:none}

/* Autocomplete dropdown */
.ac-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.12);max-height:260px;overflow-y:auto;z-index:50;display:none}
.ac-item{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;border-bottom:1px solid var(--border)}
.ac-item:last-child{border-bottom:0}
.ac-item:hover,.ac-item.selected{background:var(--accent-light)}
.ac-food{font-weight:500}
.ac-cat{font-size:.68rem;color:var(--text3);margin-left:6px}
.ac-macros{font-size:.7rem;color:var(--text2);display:flex;gap:8px}
.ac-macros .hi{color:var(--green);font-weight:600}

/* Qty row */
.qty-row{display:flex;gap:8px;align-items:end}
.qty-row .fg{display:flex;flex-direction:column;flex:1}
.qty-row .fg label{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.qty-row input,.qty-row select{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;font-family:inherit;outline:0}
.qty-row input:focus,.qty-row select:focus{border-color:var(--accent)}
.qty-row select{background:#fff}
.macro-preview{display:flex;gap:12px;font-size:.78rem;padding:8px 0;color:var(--text2)}
.macro-preview span{font-weight:600}
.add-row{text-align:right;margin-top:6px}
.btn-add{padding:8px 22px;background:var(--accent);color:#fff;border:0;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.btn-add:hover{background:#4a59ae}
.btn-add:disabled{opacity:.4;cursor:not-allowed}

/* Goals settings */
.goals-card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.goals-card h3{font-size:.95rem;font-weight:700;margin-bottom:16px}
.goals-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.goals-grid .fg{display:flex;flex-direction:column}
.goals-grid .fg label{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.goals-grid input{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.88rem;font-family:inherit;outline:0;width:100%}
.goals-grid input:focus{border-color:var(--accent)}
.goals-save{grid-column:1/-1;text-align:right;margin-top:4px}
.tip-box{font-size:.78rem;color:var(--text2);margin-top:14px;padding:12px;background:var(--accent-light);border-radius:10px;line-height:1.5}
.tip-box strong{color:var(--accent)}

/* Reference */
.ref-card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:10px;box-shadow:var(--shadow)}
.ref-card h3{font-size:.9rem;font-weight:700;margin-bottom:2px}
.ref-card .sub{font-size:.72rem;color:var(--text3);margin-bottom:12px}
.ref-tbl{width:100%;border-collapse:collapse;font-size:.78rem}
.ref-tbl th{text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);padding:5px 6px;border-bottom:2px solid var(--border)}
.ref-tbl td{padding:8px 6px;border-bottom:1px solid var(--border)}
.ref-tbl tr:last-child td{border-bottom:0}
.ref-tbl .hi{font-weight:700;color:var(--green)}
.ref-add{background:var(--green-light);color:var(--green);border:0;padding:4px 10px;border-radius:6px;font-size:.7rem;font-weight:600;cursor:pointer;font-family:inherit}
.ref-add:hover{background:var(--green);color:#fff}

/* Modal */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.modal h3{font-size:1rem;margin-bottom:16px}
.modal .fg{display:flex;flex-direction:column;margin-bottom:12px}
.modal .fg label{font-size:.68rem;color:var(--text3);text-transform:uppercase;margin-bottom:3px}
.modal select,.modal input{padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit;background:#fff;width:100%}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-cancel{padding:8px 18px;background:var(--border);color:var(--text);border:0;border-radius:8px;font-size:.82rem;cursor:pointer;font-family:inherit}

.empty{text-align:center;padding:16px;color:var(--text3);font-size:.8rem}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:10px;font-size:.82rem;font-weight:500;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

@media(max-width:500px){
  .macro-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .remaining-row{gap:10px}
  .fi-macros{gap:6px;font-size:.68rem}
}

/* Trends tab */
.trends-header{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.trends-header h3{font-size:.95rem;font-weight:700;margin-bottom:4px}
.trends-header p{font-size:.78rem;color:var(--text3)}
.chart-card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.chart-card h4{font-size:.82rem;font-weight:700;margin-bottom:14px}
.chart-wrap{position:relative;height:220px;margin-bottom:8px}
.chart-wrap canvas{width:100%!important;height:100%!important}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--text2)}
.chart-legend span{display:flex;align-items:center;gap:4px}
.chart-legend .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.avg-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.avg-card{background:var(--card);border-radius:12px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.avg-card .avg-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.avg-card .avg-val{font-size:1.2rem;font-weight:800;margin:4px 0}
.avg-card .avg-sub{font-size:.68rem;color:var(--text3)}
.history-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.history-card h4{font-size:.82rem;font-weight:700;margin-bottom:12px}
.history-tbl{width:100%;border-collapse:collapse;font-size:.78rem}
.history-tbl th{text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);padding:6px;border-bottom:2px solid var(--border)}
.history-tbl td{padding:8px 6px;border-bottom:1px solid var(--border)}
.history-tbl tr:last-child td{border-bottom:0}
.history-tbl .hi-pro{color:var(--green);font-weight:700}
.history-tbl .hi-cal{color:var(--accent);font-weight:600}
.range-btns{display:flex;gap:4px;margin-bottom:14px}
.range-btn{padding:6px 14px;border:1.5px solid var(--border);background:var(--card);border-radius:8px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text2);transition:.2s}
.range-btn.active{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.range-btn:hover:not(.active){background:#f5f5f0}
.streak-banner{display:flex;align-items:center;gap:10px;background:var(--green-light);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:.82rem;font-weight:500;color:var(--green)}
.streak-banner .streak-num{font-size:1.4rem;font-weight:800}
.clear-today-btn{display:inline-block;margin-top:10px;padding:6px 14px;border:1.5px solid var(--red);background:var(--red-light);color:var(--red);border-radius:8px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit}
.clear-today-btn:hover{background:var(--red);color:#fff}
.no-data{text-align:center;padding:30px 20px;color:var(--text3);font-size:.85rem}
@media(max-width:500px){
  .avg-cards{grid-template-columns:repeat(2,1fr);gap:8px}
}

/* Barcode scanner */
.scan-btn{padding:8px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--accent);display:flex;align-items:center;gap:5px;transition:.2s;margin-top:8px}
.scan-btn:hover{background:var(--accent-light);border-color:var(--accent)}
.scan-btn svg{width:16px;height:16px}
.scan-modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.scan-modal{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.scan-modal h3{font-size:1rem;font-weight:700;margin-bottom:4px}
.scan-modal .scan-sub{font-size:.78rem;color:var(--text3);margin-bottom:14px}
#scanReader{width:100%;border-radius:10px;overflow:hidden;margin-bottom:12px}
#scanReader video{border-radius:10px}
.scan-status{font-size:.82rem;color:var(--text2);text-align:center;padding:8px 0}
.scan-status.error{color:var(--red)}
.scan-result-card{background:var(--accent-light);border-radius:12px;padding:16px;margin-bottom:12px}
.scan-result-card h4{font-size:.9rem;font-weight:700;margin-bottom:4px}
.scan-result-card .scan-brand{font-size:.78rem;color:var(--text3);margin-bottom:10px}
.scan-result-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:.78rem;text-align:center}
.scan-result-macros .srm{padding:6px 4px;border-radius:8px;background:rgba(255,255,255,.7)}
.scan-result-macros .srm-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.3px;color:var(--text3)}
.scan-result-macros .srm-val{font-weight:700;font-size:.95rem;margin-top:2px}
.scan-or{text-align:center;font-size:.78rem;color:var(--text3);margin:10px 0;display:flex;align-items:center;gap:10px}
.scan-or::before,.scan-or::after{content:'';flex:1;height:1px;background:var(--border)}
.manual-barcode{display:flex;gap:8px}
.manual-barcode input{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit;outline:0}
.manual-barcode input:focus{border-color:var(--accent)}
.manual-barcode button{padding:8px 16px;background:var(--accent);color:#fff;border:0;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
</style>
</head>
<body>

<header>
  <h1>Macro Tracker</h1>
  <p id="dateDisplay"></p>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('tracker')">Tracker</button>
    <button class="tab" onclick="switchTab('reference')">Protein Guide</button>
    <button class="tab" onclick="switchTab('goals')">Goals</button>
    <button class="tab" onclick="switchTab('trends')">Trends</button>
  </div>

  <!-- TRACKER -->
  <div id="tab-tracker">
    <div class="summary" id="summaryCard"></div>
    <div id="remainingBanner"></div>
    <div id="mealSections"></div>
  </div>

  <!-- REFERENCE -->
  <div id="tab-reference" style="display:none"></div>

  <!-- GOALS -->
  <div id="tab-goals" style="display:none">
    <div class="goals-card">
      <h3>Daily Targets</h3>
      <div class="goals-grid">
        <div class="fg"><label>Calories (kcal)</label><input type="number" id="gCal" min="0"></div>
        <div class="fg"><label>Protein (g)</label><input type="number" id="gPro" min="0"></div>
        <div class="fg"><label>Carbs (g)</label><input type="number" id="gCarb" min="0"></div>
        <div class="fg"><label>Fat (g)</label><input type="number" id="gFat" min="0"></div>
        <div class="goals-save"><button class="btn-add" onclick="saveGoals()">Save Goals</button></div>
      </div>
      <div class="tip-box">
        <strong>Protein tip for active people:</strong> Aim for 1.6–2.2 g per kg of body weight. For a 70 kg person that's 112–154 g/day. If you're strength training, lean toward the higher end.
      </div>
    </div>
  </div>
  <!-- TRENDS -->
  <div id="tab-trends" style="display:none"></div>
</div>

<!-- Quick-add modal -->
<div id="modal" class="modal-bg" style="display:none">
  <div class="modal">
    <h3 id="modalTitle">Add to meal</h3>
    <div class="fg"><label>Meal</label>
      <select id="modalMeal"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option><option value="snacks">Snacks</option></select>
    </div>
    <div style="display:flex;gap:8px;">
      <div class="fg" style="max-width:80px"><label>Qty</label><input type="number" id="modalQty" value="1" min="0.25" step="0.25"></div>
      <div class="fg" style="flex:1"><label>Serving</label><select id="modalUnit" style="padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-family:inherit;background:#fff;width:100%"></select></div>
    </div>
    <div id="modalPreview" class="macro-preview"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-add" onclick="confirmModal()">Add</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Barcode scanner modal -->
<div id="scanModal" class="scan-modal-bg" style="display:none">
  <div class="scan-modal">
    <h3>Scan Barcode</h3>
    <p class="scan-sub">Point your camera at a product barcode</p>
    <div id="scanReader"></div>
    <div id="scanStatus" class="scan-status"></div>
    <div id="scanResult" style="display:none"></div>
    <div class="scan-or">or enter manually</div>
    <div class="manual-barcode">
      <input type="text" id="manualBarcode" placeholder="Enter barcode number..." inputmode="numeric">
      <button onclick="lookupManualBarcode()">Look up</button>
    </div>
    <div class="modal-btns" style="margin-top:14px">
      <button class="btn-cancel" onclick="closeScanModal()">Cancel</button>
      <button class="btn-add" id="scanAddBtn" onclick="addScannedFood()" style="display:none">Add</button>
    </div>
  </div>
</div>


<script>
const DB = [
// ── Meat & Poultry ──
{name:"Chicken breast",cat:"Meat",cal:165,pro:31,carb:0,fat:3.6,unit:"g",portion:150},
{name:"Chicken thigh",cat:"Meat",cal:209,pro:26,carb:0,fat:11,unit:"g",portion:150},
{name:"Chicken drumstick",cat:"Meat",cal:172,pro:28,carb:0,fat:6,unit:"g",portion:120},
{name:"Chicken wing",cat:"Meat",cal:203,pro:30,carb:0,fat:8,unit:"g",portion:80},

function getServings(food) {
  const base = food.unit === 'ml' ? {l:'ml',g:1} : {l:'g',g:1};
  const opts = [base];
  
  // Add food-specific servings
  const specific = SERVING_RULES[food.name];
  if (specific) specific.forEach(s => opts.push(s));
  
  // Add pcs-based serving from DB if not already covered
  if (food.pcs && !specific) {
    opts.push({l:food.pcs, g:food.pcsW});
  }
  
  // Add portion as "recommended serving"
  if (food.portion && food.portion !== 100) {
    const alreadyHas = opts.some(o => o.g === food.portion);
    if (!alreadyHas) opts.push({l:'serving ('+food.portion+(food.unit||'g')+')', g:food.portion});
  }

  // Add category defaults if no specific rules
  if (!specific && !food.pcs) {
    const catOpts = CAT_SERVINGS[food.cat];
    if (catOpts) catOpts.forEach(s => opts.push(s));
  }

  // Add oz for solids if not already
  if (food.unit !== 'ml' && !opts.some(o => o.l === 'oz')) {
    opts.push({l:'oz', g:28.35});
  }
  
  return opts;
}

function servingToGrams(food, servingLabel, qty) {
  const servings = getServings(food);
  const s = servings.find(o => o.l === servingLabel) || servings[0];
  return qty * s.g;
}

function formatServingDisplay(food, servingLabel, qty) {
  if (servingLabel === 'g' || servingLabel === 'ml') return qty + servingLabel;
  return qty + ' × ' + servingLabel;
}

function fuzzyMatch(query, text) {
  const q = query.toLowerCase();
  const t = text.toLowerCase();
  if (t.includes(q)) return 2;
  // check if all words in query appear in text
  const words = q.split(/\s+/);
  if (words.every(w => t.includes(w))) return 1;
  return 0;
}

function searchFoods(query) {
  if (!query || query.length < 2) return [];
  const results = [];
  DB.forEach(food => {
    const score = fuzzyMatch(query, food.name) || fuzzyMatch(query, food.cat);
    if (score > 0) results.push({ ...food, score });
  });
  results.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
  return results.slice(0, 10);
}

function onSearch(mealKey) {
  const input = document.getElementById(`search-${mealKey}`);
  const dropdown = document.getElementById(`ac-${mealKey}`);
  const clearBtn = document.getElementById(`clear-${mealKey}`);
  const query = input.value.trim();
  clearBtn.style.display = query ? 'block' : 'none';

  if (query.length < 2) { dropdown.style.display = 'none'; acIndex[mealKey] = -1; return; }

  const results = searchFoods(query);
  if (!results.length) {
    dropdown.innerHTML = '<div class="ac-item" style="color:var(--text3);cursor:default">No results found</div>';
    dropdown.style.display = 'block';
    return;
  }

  acIndex[mealKey] = -1;
  dropdown.innerHTML = results.map((f, i) => `
    <div class="ac-item" data-idx="${i}" onclick="selectFood('${mealKey}',${i})" onmouseenter="acHover('${mealKey}',${i})">
      <div><span class="ac-food">${highlightMatch(f.name, query)}</span><span class="ac-cat">${f.cat}</span></div>
      <div class="ac-macros"><span>${f.cal} cal</span><span class="hi">${f.pro}g pro</span><span>${f.carb}g C</span><span>${f.fat}g F</span></div>
    </div>`).join('');
  dropdown.style.display = 'block';

  // Store results for keyboard nav
  dropdown._results = results;
}

function highlightMatch(text, query) {
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text;
  return text.slice(0, idx) + '<strong>' + text.slice(idx, idx + query.length) + '</strong>' + text.slice(idx + query.length);
}

function onSearchKey(e, mealKey) {
  const dropdown = document.getElementById(`ac-${mealKey}`);
  if (dropdown.style.display === 'none') return;
  const items = dropdown.querySelectorAll('.ac-item[data-idx]');
  if (!items.length) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    acIndex[mealKey] = Math.min((acIndex[mealKey] ?? -1) + 1, items.length - 1);
    updateAcHighlight(mealKey, items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    acIndex[mealKey] = Math.max((acIndex[mealKey] ?? 0) - 1, 0);
    updateAcHighlight(mealKey, items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (acIndex[mealKey] >= 0) selectFood(mealKey, acIndex[mealKey]);
  } else if (e.key === 'Escape') {
    dropdown.style.display = 'none';
  }
}

function acHover(mealKey, idx) { acIndex[mealKey] = idx; updateAcHighlight(mealKey); }

function updateAcHighlight(mealKey, items) {
  items = items || document.getElementById(`ac-${mealKey}`).querySelectorAll('.ac-item[data-idx]');
  items.forEach((el, i) => el.classList.toggle('selected', i === acIndex[mealKey]));
}

function selectFood(mealKey, idx) {
  const dropdown = document.getElementById(`ac-${mealKey}`);
  const food = dropdown._results[idx];
  if (!food) return;

  selectedFoods[mealKey] = food;
  const input = document.getElementById(`search-${mealKey}`);
  input.value = food.name;
  dropdown.style.display = 'none';

  // Populate serving options
  const servings = getServings(food);
  const unitSelect = document.getElementById(`unit-${mealKey}`);
  unitSelect.innerHTML = servings.map(s => {
    const gLabel = s.l==='g'||s.l==='ml' ? '' : ` (${Math.round(s.g)}${food.unit||'g'})`;
    return `<option value="${s.l}">${s.l}${gLabel}</option>`;
  }).join('');

  // Default to first non-gram option if available, or recommended serving
  const bestDefault = servings.length > 1 ? servings[1].l : servings[0].l;
  unitSelect.value = bestDefault;
  
  // Set qty: 1 for natural units, portion for grams
  const qtyInput = document.getElementById(`qty-${mealKey}`);
  if (bestDefault === 'g' || bestDefault === 'ml') {
    qtyInput.value = food.portion || 100;
    qtyInput.step = '1';
  } else {
    qtyInput.value = 1;
    qtyInput.step = '0.25';
  }

  // Show qty area
  document.getElementById(`qtyArea-${mealKey}`).style.display = 'block';
  updatePreview(mealKey);
  qtyInput.focus();
  qtyInput.select();
}

function updatePreview(mealKey) {
  const food = selectedFoods[mealKey];
  if (!food) return;
  const qty = parseFloat(document.getElementById(`qty-${mealKey}`).value) || 0;
  const servingLabel = document.getElementById(`unit-${mealKey}`).value;
  const grams = servingToGrams(food, servingLabel, qty);
  const m = calcFromDB(food, grams);
  const display = formatServingDisplay(food, servingLabel, qty);
  const gramsNote = (servingLabel==='g'||servingLabel==='ml') ? '' : ` = ${Math.round(grams)}${food.unit||'g'}`;
  document.getElementById(`preview-${mealKey}`).innerHTML =
    `<span style="color:var(--text3)">${display}${gramsNote} →</span> <span class="cal-val">${m.cal} cal</span> <span class="pro-val">${m.pro}g pro</span> <span class="carb-val">${m.carb}g carb</span> <span class="fat-val">${m.fat}g fat</span>`;
  
  // Also update step based on unit
  const qtyInput = document.getElementById(`qty-${mealKey}`);
  if (servingLabel === 'g' || servingLabel === 'ml') {
    qtyInput.step = '1';
  } else {
    qtyInput.step = '0.25';
  }
}

function addSelected(mealKey) {

function setTrendRange(n){ trendRange=n; renderTrends(); }

function renderTrends(){
  const el=document.getElementById('tab-trends');
  const history=getHistory();
  const dates=Object.keys(history).sort().reverse();

  if(dates.length===0){
    el.innerHTML=`<div class="trends-header"><h3>Trends & History</h3><p>No data yet — start logging meals in the Tracker tab and your daily totals will appear here.</p></div>`;
    return;
  }

  // Filter to selected range
  const rangeDates=dates.slice(0, trendRange);
  const chartDates=[...rangeDates].reverse(); // chronological for chart

  // Compute averages
  const avg={cal:0,pro:0,carb:0,fat:0};
  chartDates.forEach(d=>{
    const t=history[d].totals||{cal:0,pro:0,carb:0,fat:0};
    avg.cal+=t.cal;avg.pro+=t.pro;avg.carb+=t.carb;avg.fat+=t.fat;
  });
  const n=chartDates.length;
  avg.cal=Math.round(avg.cal/n);avg.pro=Math.round(avg.pro/n);avg.carb=Math.round(avg.carb/n);avg.fat=Math.round(avg.fat/n);

  // Protein streak (consecutive days hitting >= 80% of protein goal)
  let streak=0;
  for(const d of dates){
    const t=history[d].totals||{pro:0};
    const g=history[d].goals||goals;
    if(t.pro>=g.pro*0.8) streak++; else break;
  }

  let html=`<div class="trends-header"><h3>Trends & History</h3><p>${dates.length} day${dates.length!==1?'s':''} tracked</p></div>`;

  if(streak>=2){
    html+=`<div class="streak-banner"><span class="streak-num">${streak}</span> day protein streak (≥80% of goal)</div>`;
  }

  // Range buttons
  html+=`<div class="range-btns">
    <button class="range-btn ${trendRange===7?'active':''}" onclick="setTrendRange(7)">7 days</button>
    <button class="range-btn ${trendRange===14?'active':''}" onclick="setTrendRange(14)">14 days</button>
    <button class="range-btn ${trendRange===30?'active':''}" onclick="setTrendRange(30)">30 days</button>
    <button class="range-btn ${trendRange===9999?'active':''}" onclick="setTrendRange(9999)">All</button>
  </div>`;

  // Average cards
  html+=`<div class="avg-cards">
    <div class="avg-card"><div class="avg-label cal-label">Avg Calories</div><div class="avg-val cal-val">${avg.cal}</div><div class="avg-sub">/ ${goals.cal} goal</div></div>
    <div class="avg-card"><div class="avg-label pro-label">Avg Protein</div><div class="avg-val pro-val">${avg.pro}g</div><div class="avg-sub">/ ${goals.pro}g goal</div></div>
    <div class="avg-card"><div class="avg-label carb-label">Avg Carbs</div><div class="avg-val carb-val">${avg.carb}g</div><div class="avg-sub">/ ${goals.carb}g goal</div></div>
    <div class="avg-card"><div class="avg-label fat-label">Avg Fat</div><div class="avg-val fat-val">${avg.fat}g</div><div class="avg-sub">/ ${goals.fat}g goal</div></div>
  </div>`;

  // Canvas chart
  html+=`<div class="chart-card">
    <h4>Macro Trends</h4>
    <div class="chart-wrap"><canvas id="trendsCanvas"></canvas></div>
    <div class="chart-legend">
      <span><span class="dot" style="background:var(--accent)"></span>Calories (÷10)</span>
      <span><span class="dot" style="background:var(--green)"></span>Protein</span>
      <span><span class="dot" style="background:var(--orange)"></span>Carbs</span>
      <span><span class="dot" style="background:var(--blue)"></span>Fat</span>
    </div>
  </div>`;

  // History table
  html+=`<div class="history-card"><h4>Daily Log</h4><table class="history-tbl">
    <tr><th>Date</th><th>Cal</th><th>Protein</th><th>Carbs</th><th>Fat</th><th>Items</th></tr>`;
  rangeDates.forEach(d=>{
    const t=history[d].totals||{cal:0,pro:0,carb:0,fat:0};
    const m=history[d].meals||{};
    const items=Object.values(m).reduce((s,arr)=>s+(arr.length||0),0);
    const g=history[d].goals||goals;
    const calPct=g.cal>0?Math.round(t.cal/g.cal*100):0;
    const proPct=g.pro>0?Math.round(t.pro/g.pro*100):0;
    const carbPct=g.carb>0?Math.round(t.carb/g.carb*100):0;
    const fatPct=g.fat>0?Math.round(t.fat/g.fat*100):0;
    const dateLabel=new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    const isToday=d===todayKey();
    html+=`<tr${isToday?' style="font-weight:600"':''}>
      <td>${isToday?'Today':dateLabel}</td>
      <td class="hi-cal">${t.cal} <span style="font-size:.68rem;color:var(--text3)">(${calPct}%)</span></td>
      <td class="hi-pro">${t.pro}g <span style="font-size:.68rem;color:var(--text3)">(${proPct}%)</span></td>
      <td>${t.carb}g <span style="font-size:.68rem;color:var(--text3)">(${carbPct}%)</span></td>
      <td>${t.fat}g <span style="font-size:.68rem;color:var(--text3)">(${fatPct}%)</span></td>
      <td>${items}</td>
    </tr>`;
  });
  html+=`</table></div>`;

  // Clear today option
  html+=`<div style="text-align:center;padding:10px"><button class="clear-today-btn" onclick="clearTodayData()">Clear today's data</button></div>`;

  el.innerHTML=html;

  // Draw canvas chart
  requestAnimationFrame(()=>drawTrendsChart(chartDates, history));
}

function drawTrendsChart(dates, history){
  const canvas=document.getElementById('trendsCanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  ctx.scale(dpr,dpr);
  const W=rect.width, H=rect.height;
  const pad={top:10,right:14,bottom:32,left:38};
  const cW=W-pad.left-pad.right, cH=H-pad.top-pad.bottom;

  if(dates.length<1) return;

  // Build data series
  const series={
    cal:{data:[], color:'#5b6abf'},
    pro:{data:[], color:'#2d8e5e'},
    carb:{data:[], color:'#d97a2a'},
    fat:{data:[], color:'#3f7fcf'},
  };
  dates.forEach(d=>{
    const t=history[d]?.totals||{cal:0,pro:0,carb:0,fat:0};
    series.cal.data.push(t.cal/10); // scale cal down
    series.pro.data.push(t.pro);
    series.carb.data.push(t.carb);
    series.fat.data.push(t.fat);
  });

  // Find max Y across all series
  let maxY=50;
  Object.values(series).forEach(s=>s.data.forEach(v=>{if(v>maxY)maxY=v;}));
  maxY=Math.ceil(maxY/50)*50;if(maxY<100)maxY=100;

  // Draw grid
  ctx.strokeStyle='#e5e3de';ctx.lineWidth=1;
  const gridLines=5;
  ctx.font='10px Inter, sans-serif';ctx.fillStyle='#999';ctx.textAlign='right';
  for(let i=0;i<=gridLines;i++){
    const y=pad.top+cH-cH*(i/gridLines);
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();
    ctx.fillText(Math.round(maxY*i/gridLines),pad.left-6,y+3);
  }

  // Date labels
  ctx.textAlign='center';ctx.fillStyle='#999';
  const maxLabels=Math.min(dates.length,10);
  const step=Math.max(1,Math.floor(dates.length/maxLabels));
  dates.forEach((d,i)=>{
    if(i%step!==0&&i!==dates.length-1) return;
    const x=pad.left+(dates.length>1?i/(dates.length-1):0.5)*cW;
    const label=new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
    ctx.fillText(label,x,H-pad.bottom+18);
  });

  // Draw lines
  function drawLine(data, color, dashed){
    ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';
    if(dashed) ctx.setLineDash([4,4]); else ctx.setLineDash([]);
    ctx.beginPath();
    data.forEach((v,i)=>{
      const x=pad.left+(dates.length>1?i/(dates.length-1):0.5)*cW;
      const y=pad.top+cH-cH*(v/maxY);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();

    // dots
    ctx.setLineDash([]);
    data.forEach((v,i)=>{
      const x=pad.left+(dates.length>1?i/(dates.length-1):0.5)*cW;
      const y=pad.top+cH-cH*(v/maxY);
      ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
      ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    });
  }

  drawLine(series.cal.data, series.cal.color, false);
  drawLine(series.pro.data, series.pro.color, false);
  drawLine(series.carb.data, series.carb.color, true);
  drawLine(series.fat.data, series.fat.color, true);

  // Goal line for protein
  const proGoalY=pad.top+cH-cH*(goals.pro/maxY);
  ctx.strokeStyle='#2d8e5e';ctx.lineWidth=1;ctx.setLineDash([6,4]);ctx.globalAlpha=0.4;
  ctx.beginPath();ctx.moveTo(pad.left,proGoalY);ctx.lineTo(W-pad.right,proGoalY);ctx.stroke();
  ctx.globalAlpha=1;ctx.setLineDash([]);
  ctx.font='9px Inter, sans-serif';ctx.fillStyle='#2d8e5e';ctx.textAlign='left';
  ctx.fillText('protein goal',pad.left+4,proGoalY-4);
}

async function startScanner() {
  if (typeof Html5Qrcode === 'undefined') {
    document.getElementById('scanStatus').textContent = 'Scanner library still loading... try again in a moment, or use manual entry.';
    document.getElementById('scanStatus').className = 'scan-status error';
    return;
  }

  const statusEl = document.getElementById('scanStatus');
  scannerInstance = new Html5Qrcode('scanReader');

  const onSuccess = (decodedText) => {
    stopScanner();
    statusEl.textContent = 'Barcode found: ' + decodedText + ' — looking up...';
    statusEl.className = 'scan-status';
    lookupBarcode(decodedText);
  };

  const onError = (msg) => { /* scanning, no match yet */ };

  const scanConfig = {
    fps: 15,
    qrbox: function(viewW, viewH) {
      const w = Math.min(280, Math.floor(viewW * 0.85));
      const h = Math.min(120, Math.floor(viewH * 0.4));
      return { width: Math.max(150, w), height: Math.max(60, h) };
    },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39
    ]
  };

  // Try back camera first, then any camera
  try {
    statusEl.textContent = 'Requesting camera access...';
    await scannerInstance.start({ facingMode: 'environment' }, scanConfig, onSuccess, onError);
    statusEl.textContent = 'Scanning... hold the barcode steady in the box';
    return;
  } catch(e) {
    console.warn('Back camera failed, trying any camera:', e);
  }

  // Fallback: try listing cameras and use the first one
  try {
    const cameras = await Html5Qrcode.getCameras();
    if (cameras && cameras.length > 0) {
      statusEl.textContent = 'Starting camera...';
      await scannerInstance.start(cameras[0].id, scanConfig, onSuccess, onError);
      statusEl.textContent = 'Scanning... hold the barcode steady in the box';
      return;
    }
  } catch(e2) {
    console.warn('Camera list failed:', e2);
  }

  statusEl.textContent = 'Camera not available. Use manual barcode entry below.';
  statusEl.className = 'scan-status error';
}

function stopScanner() {
  if (scannerInstance) {
    try { scannerInstance.stop().catch(() => {}); } catch(e) {}
    try { scannerInstance.clear().catch(() => {}); } catch(e) {}
    scannerInstance = null;
  }
}

function lookupManualBarcode() {
  const code = document.getElementById('manualBarcode').value.trim();
  if (!code) return;
  document.getElementById('scanStatus').textContent = 'Looking up ' + code + '...';
  document.getElementById('scanStatus').className = 'scan-status';
  lookupBarcode(code);
}

async function fetchWithFallback(url) {
  // 1) Try fetch directly (works from http:// origins)
  try {
    const controller = new AbortController();
    const timer = setTimeout(function(){ controller.abort(); }, 6000);
    const resp = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);
    if (resp.ok) return await resp.json();
  } catch(e) { /* fetch blocked from file://, fall through */ }

  // 2) JSONP via allorigins.win <script> tag (works from file://)
  try {
    return await fetchViaJSONP(url);
  } catch(e) { /* JSONP failed too */ }

  return null;
}

function fetchViaJSONP(url) {
  return new Promise(function(resolve, reject) {
    var cbName = '_offCb_' + Math.random().toString(36).slice(2);
    var timer = setTimeout(function() {
      cleanup();
      reject(new Error('Timeout'));
    }, 12000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      var s = document.getElementById(cbName);
      if (s) s.remove();
    }

    window[cbName] = function(response) {
      cleanup();
      try {
        // allorigins wraps in {contents: "json string", status: {...}}
        if (response && response.contents) {
          resolve(JSON.parse(response.contents));
        } else {
          reject(new Error('No contents'));
        }
      } catch(e) { reject(e); }
    };

    var script = document.createElement('script');
    script.id = cbName;
    script.src = 'https://api.allorigins.win/get?callback=' + cbName + '&url=' + encodeURIComponent(url);
    script.onerror = function() { cleanup(); reject(new Error('Script load error')); };
    document.head.appendChild(script);
  });
}

async function lookupBarcode(barcode) {
  const statusEl = document.getElementById('scanStatus');
  statusEl.textContent = 'Looking up barcode ' + barcode + '...';
  statusEl.className = 'scan-status';

  const url = 'https://world.openfoodfacts.org/api/v2/product/' + barcode + '.json';
  const data = await fetchWithFallback(url);

  if (!data) {
    statusEl.textContent = 'Could not reach Open Food Facts. Check your internet connection.';
    statusEl.className = 'scan-status error';
    return;
  }

  if (data.status !== 1 || !data.product) {
    statusEl.textContent = 'Product not found for barcode ' + barcode + '. Try another or add manually.';
    statusEl.className = 'scan-status error';
    return;
  }

  const p = data.product;
  const n = p.nutriments || {};

  // Get values per 100g
  const cal = Math.round(n['energy-kcal_100g'] || (n['energy_100g'] ? n['energy_100g'] / 4.184 : 0));
  const pro = Math.round((n.proteins_100g || 0) * 10) / 10;
  const carb = Math.round((n.carbohydrates_100g || 0) * 10) / 10;
  const fat = Math.round((n.fat_100g || 0) * 10) / 10;

  const name = p.product_name || p.product_name_en || p.product_name_fr || 'Unknown product';
  const brand = p.brands || '';
  const servingSize = p.serving_size || '';
  const servingG = parseFloat(p.serving_quantity) || 100;
  const imgUrl = p.image_front_small_url || '';

  scannedProduct = {
    name: name + (brand ? ' (' + brand + ')' : ''),
    shortName: name,
    brand,
    cal, pro, carb, fat,
    servingSize,
    servingG,
    unit: 'g',
    portion: servingG,
    barcode
  };

  // Show result card
  const resultEl = document.getElementById('scanResult');
  resultEl.style.display = 'block';
  resultEl.innerHTML =
    '<div class="scan-result-card">' +
      '<div style="display:flex;gap:12px;align-items:start">' +
        (imgUrl ? '<img src="'+imgUrl+'" style="width:50px;height:50px;object-fit:contain;border-radius:8px;background:#f5f5f5">' : '') +
        '<div style="flex:1">' +
          '<h4>'+name+'</h4>' +
          '<div class="scan-brand">'+brand+(servingSize ? ' · Serving: '+servingSize : '')+'</div>' +
        '</div>' +
      '</div>' +
      '<div class="scan-result-macros">' +
        '<div class="srm"><div class="srm-label">Cal/100g</div><div class="srm-val cal-val">'+cal+'</div></div>' +
        '<div class="srm"><div class="srm-label">Pro/100g</div><div class="srm-val pro-val">'+pro+'g</div></div>' +
        '<div class="srm"><div class="srm-label">Carb/100g</div><div class="srm-val carb-val">'+carb+'g</div></div>' +
        '<div class="srm"><div class="srm-label">Fat/100g</div><div class="srm-val fat-val">'+fat+'g</div></div>' +
      '</div>' +
      '<div style="margin-top:10px;display:flex;gap:8px;align-items:end">' +
        '<div class="fg" style="max-width:80px"><label style="font-size:.62rem;color:var(--text3);text-transform:uppercase">Qty</label><input type="number" id="scanQty" value="1" min="0.25" step="0.25" oninput="updateScanPreview()" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;width:100%;font-family:inherit"></div>' +
        '<div class="fg" style="flex:1"><label style="font-size:.62rem;color:var(--text3);text-transform:uppercase">Serving</label><select id="scanUnit" onchange="updateScanPreview()" style="padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;font-family:inherit;background:#fff;width:100%">' +
          (servingSize ? '<option value="serving">'+servingSize+' ('+Math.round(servingG)+'g)</option>' : '') +
          '<option value="g">grams</option>' +
        '</select></div>' +
      '</div>' +
      '<div id="scanPreview" class="macro-preview" style="margin-top:6px"></div>' +
    '</div>';

  document.getElementById('scanAddBtn').style.display = '';
  statusEl.textContent = 'Product found!';
  statusEl.className = 'scan-status';

  updateScanPreview();
}

function updateScanPreview() {
  if (!scannedProduct) return;
  const qty = parseFloat(document.getElementById('scanQty').value) || 0;
  const unitSel = document.getElementById('scanUnit').value;
  let grams;
  if (unitSel === 'serving') {
    grams = qty * scannedProduct.servingG;
  } else {
    grams = qty;
  }
  const f = grams / 100;
  const cal = Math.round(scannedProduct.cal * f);
  const pro = Math.round(scannedProduct.pro * f);
  const carb = Math.round(scannedProduct.carb * f);
  const fat = Math.round(scannedProduct.fat * f);

  const label = unitSel === 'serving'
    ? qty + ' × serving (' + Math.round(grams) + 'g)'
    : Math.round(grams) + 'g';

  document.getElementById('scanPreview').innerHTML =
    '<span style="color:var(--text3)">' + label + ' →</span> ' +
    '<span class="cal-val">' + cal + ' cal</span> ' +
    '<span class="pro-val">' + pro + 'g pro</span> ' +
    '<span class="carb-val">' + carb + 'g carb</span> ' +
    '<span class="fat-val">' + fat + 'g fat</span>';
}

function addScannedFood() {
  if (!scannedProduct || !scanMealKey) return;
  const qty = parseFloat(document.getElementById('scanQty').value) || 0;
  if (qty <= 0) return;
  const unitSel = document.getElementById('scanUnit').value;
  let grams;
  if (unitSel === 'serving') {
    grams = qty * scannedProduct.servingG;
  } else {
    grams = qty;
  }
  const f = grams / 100;
  const cal = Math.round(scannedProduct.cal * f);
  const pro = Math.round(scannedProduct.pro * f);
  const carb = Math.round(scannedProduct.carb * f);
  const fat = Math.round(scannedProduct.fat * f);

  const display = unitSel === 'serving'
    ? qty + ' × serving (' + Math.round(grams) + 'g)'
    : Math.round(grams) + 'g';

  const foodName = scannedProduct.shortName;
  const mealKey = scanMealKey;

  meals[mealKey].items.push({
    name: foodName,
    qty: Math.round(grams),
    unit: 'g',
    display,
    cal, pro, carb, fat,
    barcode: scannedProduct.barcode
  });

  openMeals[mealKey] = true;
  closeScanModal();
  toast('Added ' + foodName + ' to ' + mealKey);
  renderMeals();
  renderSummary();
  renderRemaining();
  saveTodayMeals();
}

// ========== SERVICE WORKER ==========
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(function(reg) {
    console.log('SW registered:', reg.scope);
  }).catch(function(err) {
    console.warn('SW registration failed:', err);
  });
}

// ========== INIT ==========
renderSummary();
renderRemaining();
renderMeals();
renderReference();
// Auto-save on load (in case we loaded existing data)
if(getDayTotals().cal>0) saveTodayMeals();
</script>
